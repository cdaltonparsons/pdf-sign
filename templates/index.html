<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Sign</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    /* Teach the browser about each handwriting font, so the choices below
       look the same as the signature that ends up in the PDF. */
    {% for key, font in fonts.items() %}
    @font-face { font-family: "sig-{{ key }}"; src: url("{{ url_for('static', filename='fonts/' + font.file) }}"); }
    {% endfor %}
  </style>
</head>
<body>
  <!-- The left panel holds all the controls. -->
  <aside class="panel">
    <h1>PDF Sign</h1>

    <section>
      <h2>1. Open a PDF</h2>
      <input type="file" id="pdf-input" accept="application/pdf">
      <p id="form-note" class="hint" hidden></p>
    </section>

    <section>
      <h2>2. Your signature</h2>
      <!-- Two ways to make a signature. Only one panel shows at a time. -->
      <div class="tabs">
        <button type="button" id="mode-photo" class="active">Photo</button>
        <button type="button" id="mode-typed">Type it</button>
      </div>

      <div id="photo-panel">
        <input type="file" id="signature-input" accept="image/*,.heic">
      </div>

      <div id="typed-panel" hidden>
        <input type="text" id="typed-name" placeholder="Type your name">
        <div id="font-choices">
          {% for key, font in fonts.items() %}
          <label class="font-choice" title="{{ font.name }}">
            <input type="radio" name="font" value="{{ key }}" {% if loop.first %}checked{% endif %}>
            <span class="font-sample" style="font-family: 'sig-{{ key }}'">{{ font.name }}</span>
          </label>
          {% endfor %}
        </div>
      </div>

      <div id="signature-preview" class="checkerboard" hidden>
        <img id="signature-img" alt="Your signature">
      </div>
      <label id="threshold-row" hidden>
        Background removal
        <input type="range" id="threshold" min="100" max="250" value="200">
        <small>Slide right if parts of the ink disappear. Slide left if paper still shows.</small>
      </label>
      <button id="place-signature" class="tool" disabled>Place signature</button>
    </section>

    <section>
      <h2>3. Text</h2>
      <input type="text" id="text-value" placeholder="Type something">
      <div class="row">
        <button id="today" type="button">Today's date</button>
        <label>Size <input type="number" id="text-size" value="12" min="6" max="72"></label>
      </div>
      <button id="place-text" class="tool" disabled>Place text</button>
    </section>

    <section>
      <h2>4. Save</h2>
      <button id="download" class="primary" disabled>Download signed PDF</button>
    </section>

    <p id="hint" class="hint">Open a PDF to get started.</p>
  </aside>

  <!-- The PDF pages appear here. -->
  <main id="pages"></main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
